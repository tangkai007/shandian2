// 闪电AI2.0 · 瞬间直播 —— 后端（MARS-1 一期 MVP）
// 形态：模块化单体，14 个模块以【包级强边界】落在单一 Gradle 工程内（S1a v0.4 §5.1）。
// 语言/运行时：Java 17（S1a §1.3）。构建：Gradle 8 + Spring Boot 3。
//
// 分层约定：
//   * 【领域核心】零依赖纯 Java（各模块的 policy 与 service），可在任何 JDK 上直编直跑（见 specCheck）；
//   * 【装配层】Spring Boot（Web / MyBatis / Flyway / Redis）+ 三方 SDK，只做适配，不含业务判定。

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.mars'
version = '0.1.0-SNAPSHOT'

java {
    // 目标 = Java 17（S1a §1.3）。此处用 sourceCompatibility/targetCompatibility + `options.release = 17`
    // 而非严格 toolchain：这样在 JDK 17 / 21 上都能构建，且产出的字节码与 API 级别恒为 17。
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    mybatisStarterVersion = '3.0.3'
}

dependencies {
    // Web / 参数校验
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 持久化：JDBC + MyBatis + Flyway（单库 mars_live，S1a §6.1）
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisStarterVersion}"
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 缓存 / 令牌黑名单 / 限流 / 在线人数 / 热度 ZSet（S1a §6.1）
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // 保留参数名：MyBatis 以构造器映射 record 型领域对象时依赖它（否则退化为位置映射）。
    options.compilerArgs << '-parameters'
}

// 零依赖 spec 套件：不依赖 JUnit / Spring，可在任何 JDK 17+ 上直接运行（本地与 CI 同一条命令）。
tasks.register('specCheck', JavaExec) {
    group = 'verification'
    description = '运行仓库内零依赖 spec 套件（AC-1 / AC-4 / AC-5 / AC-6 / AC-8 等核心域断言）。'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mars.testkit.AllSpecs'
}

tasks.named('test') {
    useJUnitPlatform()
    // 领域核心由 specCheck 断言；JUnit 承载装配层切片测试。
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('check') {
    dependsOn 'specCheck'
}
